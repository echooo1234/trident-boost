name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi Klonla
        uses: actions/checkout@v4

      - name: Java 21 Kurulumu (1.20.5+ Fabric için gereklidir)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle Yetkilerini Ayarla
        run: chmod +x gradlew

      - name: Fabric Modunu Derle (Build)
        run: ./gradlew build

      - name: Hazır JAR Dosyasını Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod-JAR
          path: build/libs/*.jar
